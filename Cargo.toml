[package]
name = "poste"
version = "0.1.0"
edition = "2024"
description = "Local search and management layer over Proton Mail exports"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.42", features = ["bundled"] }
sqlite-vec = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
mailparse = "0.18"
html2text = "0.17"
chrono = "0.4"
dirs = "7"
toml = "1"

[dev-dependencies]
tempfile = "3"
rusqlite = { version = "0.42", features = ["bundled"] }

# --- scaffold ---
[profile.dev]
overflow-checks = true
lto = "fat"

[profile.release]
overflow-checks = true
lto = "fat"
opt-level = 3
strip = "debuginfo"
incremental = true

[lints.clippy]
complexity = "warn"
correctness = "warn"
nursery = "warn"
pedantic = "warn"
perf = "warn"
suspicious = "warn"
allow_attributes_without_reason = "warn"
